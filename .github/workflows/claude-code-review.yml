name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

# Deny-by-default GITHUB_TOKEN: every job declares exactly the scopes it
# needs, so a new job (or a repo default flipped to read-write) can't
# silently gain write access.
permissions: {}

jobs:
  # The review action aborts ("Environment variable validation failed") when
  # no credential is configured, which red-fails every PR. `secrets` can't be
  # read in a job-level `if`, so surface the token's presence as an output and
  # gate the review on it: the job SKIPS (not fails) until the repo sets
  # CLAUDE_CODE_OAUTH_TOKEN, and runs normally once it does.
  check-token:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "present=false" >> "$GITHUB_OUTPUT"; fi

  claude-review:
    needs: check-token
    # Same-repo PRs only. GitHub withholds secrets and OIDC tokens from
    # `pull_request` runs triggered by forks, so this job can only fail there.
    # Don't "fix" that with `pull_request_target` — it would hand the OAuth
    # token to a run driven by fork-controlled content. For fork PRs, a
    # maintainer can comment `@claude review this PR` (claude.yml) instead.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && needs.check-token.outputs.present == 'true'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@97c53473391bff1901034d4b454b5bac7ab7a029 # v1.0.239
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

